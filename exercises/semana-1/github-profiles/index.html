<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profiles — Semana 1</title>
  <meta name="description" content="Galería de los perfiles creados por los estudiantes de undefined academy en la Semana 1." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;
      --border-strong: #8b949e;
      --text: #c9d1d9;
      --text-strong: #f0f6fc;
      --muted: #8b949e;
      --faint: #484f58;
      --accent: #58a6ff;
      --success: #238636;
      --success-strong: #2ea043;
      --radius: 8px;
      --thumb-w: 1280;
      --thumb-h: 800;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap { max-width: 1400px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    header { margin-bottom: 1.25rem; }
    h1 { font-size: 1.5rem; font-weight: 600; color: var(--text-strong); }
    .subtitle { font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.75rem 0;
      margin-bottom: 1rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    #search {
      flex: 1 1 220px;
      min-width: 0;
      padding: 0.5rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.875rem;
    }
    #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgb(88 166 255 / 0.25); }
    #search::placeholder { color: var(--faint); }

    button {
      font: inherit;
      padding: 0.5rem 0.875rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      cursor: pointer;
      white-space: nowrap;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--border); border-color: var(--border-strong); }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .segmented button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
    .segmented button + button { border-left: 1px solid var(--border); }
    .segmented button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-strong); }

    .btn-primary {
      background: var(--success);
      color: #fff;
      border-color: var(--success-strong);
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--success-strong); border-color: var(--success-strong); }
    .btn-primary:disabled { background: var(--surface-2); color: var(--faint); border-color: var(--border); cursor: not-allowed; }

    .count { font-size: 0.8125rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

    .popup-note { font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; }
    .popup-note strong { color: #e3b341; }

    /* ---------- Grid view ---------- */
    .grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 8px 24px rgb(0 0 0 / 0.4); }
    .card.selected { border-color: var(--success-strong); box-shadow: 0 0 0 1px var(--success-strong); }

    .thumb {
      position: relative;
      display: block;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .thumb iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(var(--thumb-w) * 1px);
      height: calc(var(--thumb-h) * 1px);
      border: 0;
      transform: scale(var(--scale, 0.2));
      transform-origin: 0 0;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .thumb.loaded iframe { opacity: 1; }
    .thumb .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--faint);
      background: linear-gradient(110deg, var(--surface) 40%, var(--surface-2) 50%, var(--surface) 60%) 0 0 / 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    .thumb.loaded .placeholder { animation: none; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .thumb .open-hint {
      position: absolute;
      z-index: 1;
      right: 0.5rem;
      bottom: 0.5rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      color: #fff;
      background: rgb(13 17 23 / 0.85);
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover .open-hint, .thumb:focus-visible .open-hint { opacity: 1; }

    .meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 0.75rem;
      min-width: 0;
    }
    .meta input[type="checkbox"] { width: 15px; height: 15px; flex-shrink: 0; accent-color: var(--success-strong); cursor: pointer; }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--surface-2);
      object-fit: cover;
    }

    .name {
      flex: 1;
      min-width: 0;
      font-size: 0.875rem;
      color: var(--text-strong);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name:hover { color: var(--accent); text-decoration: underline; }

    .icon-link {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      color: var(--muted);
      border-radius: 6px;
    }
    .icon-link:hover { color: var(--text-strong); background: var(--surface-2); }
    .icon-link svg { width: 16px; height: 16px; fill: currentColor; }

    /* ---------- List view ---------- */
    .grid.list { grid-template-columns: 1fr; gap: 2px; }
    .grid.list .card { flex-direction: row; background: transparent; border-color: transparent; transform: none; box-shadow: none; }
    .grid.list .card:hover { background: var(--surface); border-color: var(--border); }
    .grid.list .card.selected { border-color: var(--success-strong); }
    .grid.list .thumb { display: none; }
    .grid.list .meta { flex: 1; padding: 0.35rem 0.75rem; }

    .hidden { display: none !important; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.875rem; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
      .meta { padding: 0.5rem; gap: 0.375rem; }
      .grid:not(.list) .meta .icon-link { display: none; }
      .count { width: 100%; margin-left: 0; order: 10; }
      .toolbar .btn-text { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .thumb .placeholder { transition: none; animation: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>

  const ICON_CODE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m11.28 3.22 4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L13.94 8l-3.72-3.72a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215Zm-6.56 0a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L2.06 8l3.72 3.72a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L.47 8.53a.75.75 0 0 1 0-1.06Z"/></svg>';

  const gridEl = document.getElementById("grid");
  const searchEl = document.getElementById("search");
  const countEl = document.getElementById("count");
  const openBtn = document.getElementById("openBtn");
  const emptyState = document.getElementById("emptyState");
  const viewButtons = document.querySelectorAll("[data-view]");

  const selected = new Set();
  const siteUrl = folder => `./${encodeURIComponent(folder)}/index.html`;

  // Load each live preview only when its card scrolls near the viewport.
  const previewObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const thumb = entry.target;
      previewObserver.unobserve(thumb);
      const iframe = document.createElement("iframe");
      iframe.src = thumb.href;
      iframe.title = `Vista previa de ${thumb.dataset.folder}`;
      iframe.tabIndex = -1;
      iframe.setAttribute("sandbox", ""); // no scripts, alerts or audio in previews
      const reveal = () => thumb.classList.add("loaded");
      iframe.addEventListener("load", reveal, { once: true });
      setTimeout(reveal, 4000); // don't wait forever on slow third-party assets
      thumb.querySelector(".placeholder").after(iframe);
    });
  }, { rootMargin: "400px 0px" });

  // Scale the 1280×800 previews down to the card width.
  const scaleObserver = new ResizeObserver(entries => {
    const width = entries[0].contentRect.width;
    if (width) gridEl.style.setProperty("--scale", width / 1280);
  });

  function createCard([folder, github]) {
    const li = document.createElement("li");
    li.className = "card";
    li.dataset.search = `${folder} ${github ?? ""}`.toLowerCase();

    const thumb = document.createElement("a");
    thumb.className = "thumb";
    thumb.href = siteUrl(folder);
    thumb.target = "_blank";
    thumb.rel = "noopener noreferrer";
    thumb.dataset.folder = folder;
    thumb.setAttribute("aria-label", `Abrir el sitio de ${folder}`);
    thumb.innerHTML = `<span class="placeholder" aria-hidden="true"></span><span class="open-hint" aria-hidden="true">Abrir sitio ↗</span>`;
    thumb.querySelector(".placeholder").textContent = folder.slice(0, 2).toUpperCase();

    const meta = document.createElement("div");
    meta.className = "meta";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.setAttribute("aria-label", `Seleccionar ${folder}`);
    cb.addEventListener("change", () => {
      cb.checked ? selected.add(folder) : selected.delete(folder);
      li.classList.toggle("selected", cb.checked);
      updateButton();
    });
    meta.append(cb);

    if (github) {
      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.src = `https://github.com/${github}.png?size=48`;
      avatar.alt = "";
      avatar.loading = "lazy";
      avatar.width = avatar.height = 24;
      avatar.addEventListener("error", () => avatar.remove(), { once: true });
      meta.append(avatar);
    }

    const name = document.createElement("a");
    name.className = "name";
    name.href = siteUrl(folder);
    name.target = "_blank";
    name.rel = "noopener noreferrer";
    name.textContent = folder;
    name.title = folder;
    meta.append(name);

    if (github) {
      meta.append(iconLink(`https://github.com/${github}`, ICON_GITHUB, `Perfil de GitHub de ${github}`, "github"));
    }
    meta.append(iconLink(REPO_TREE + encodeURIComponent(folder), ICON_CODE, `Código fuente de ${folder}`, "source"));

    li.append(thumb, meta);
    li._thumb = thumb;
    li._checkbox = cb;
    return li;
  }

  function iconLink(href, icon, label, cls) {
    const a = document.createElement("a");
    a.className = `icon-link ${cls}`;
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = label;
    a.setAttribute("aria-label", label);
    a.innerHTML = icon;
    return a;
  }

  const cards = profiles.map(createCard);
  gridEl.append(...cards);
  cards.forEach(card => previewObserver.observe(card._thumb));
  scaleObserver.observe(cards[0]._thumb);

  function visibleCards() {
    return cards.filter(card => !card.classList.contains("hidden"));
  }

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    cards.forEach(card => card.classList.toggle("hidden", !!q && !card.dataset.search.includes(q)));
    const visible = visibleCards().length;
    emptyState.classList.toggle("hidden", visible > 0);
    countEl.textContent = visible === cards.length
      ? `${cards.length} perfiles`
      : `${visible} de ${cards.length} perfiles`;
  }

  function updateButton() {
    openBtn.disabled = selected.size === 0;
    openBtn.textContent = selected.size > 0 ? `Abrir ${selected.size} en pestañas` : "Abrir en pestañas";
  }

  function setSelected(card, value) {
    card._checkbox.checked = value;
    card._checkbox.dispatchEvent(new Event("change"));
  }

  function setView(view) {
    gridEl.classList.toggle("list", view === "list");
    viewButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    try { localStorage.setItem("profiles-view", view); } catch {}
  }

  document.getElementById("selectAll").addEventListener("click", () => visibleCards().forEach(c => setSelected(c, true)));
  document.getElementById("clearSel").addEventListener("click", () => cards.forEach(c => c._checkbox.checked && setSelected(c, false)));
  openBtn.addEventListener("click", () => selected.forEach(folder => window.open(siteUrl(folder), "_blank")));
  viewButtons.forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  searchEl.addEventListener("input", applyFilter);

  try { setView(localStorage.getItem("profiles-view") || "grid"); } catch { setView("grid"); }
  applyFilter();
  updateButton();
</script>
</body>
</html>
